<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Account Pool Manager</title>
<link rel="icon" type="image/png" id="favicon" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css" />
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface-2: #f0f2f8;
    --border: #e2e5ef;
    --border-light: #edf0f7;
    --text-primary: #1a1d2e;
    --text-secondary: #6b7394;
    --text-tertiary: #9aa3c2;
    --accent: #6366f1;
    --accent-hover: #4f52d4;
    --accent-light: #eef2ff;
    --green: #10b981;
    --green-bg: #d1fae5;
    --green-text: #065f46;
    --amber: #f59e0b;
    --amber-bg: #fef3c7;
    --amber-text: #78350f;
    --red: #ef4444;
    --red-bg: #fee2e2;
    --red-text: #7f1d1d;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow: 0 4px 12px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.06);
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface-2: #252840;
    --border: #2e3255;
    --border-light: #252840;
    --text-primary: #e8eaf6;
    --text-secondary: #8b93c0;
    --text-tertiary: #5c6490;
    --accent: #818cf8;
    --accent-hover: #6366f1;
    --accent-light: #1e2040;
    --green: #34d399;
    --green-bg: #064e3b;
    --green-text: #6ee7b7;
    --amber: #fbbf24;
    --amber-bg: #451a03;
    --amber-text: #fde68a;
    --red: #f87171;
    --red-bg: #450a0a;
    --red-text: #fca5a5;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.2);
    --shadow: 0 4px 12px rgba(0,0,0,.3);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.4);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    transition: background .2s, color .2s;
  }

  /* ── Layout ── */
  .app {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }

  /* ── Header ── */
  .hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 16px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hdr-left { display: flex; align-items: center; gap: 12px; }
  .hdr-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hdr-icon {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 18px;
    box-shadow: 0 2px 8px rgba(99,102,241,.35);
    flex-shrink: 0;
  }
  .hdr-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -.3px;
  }
  .hdr-sub {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 400;
    display: block;
  }

  .stats-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-pill {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 5px;
    border: 1px solid transparent;
  }
  .s-ready { background: var(--green-bg); color: var(--green-text); }
  .s-cooling { background: var(--amber-bg); color: var(--amber-text); }
  .s-expired { background: var(--red-bg); color: var(--red-text); }

  .hdr-actions { display: flex; gap: 6px; align-items: center; }

  /* ── Theme toggle ── */
  .theme-btn {
    width: 34px; height: 34px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all .15s;
    box-shadow: var(--shadow-sm);
  }
  .theme-btn:hover { background: var(--surface-2); color: var(--text-primary); }

  /* ── Platform filter ── */
  .platform-section {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    padding: 12px 14px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }
  .platform-filter {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    flex-wrap: nowrap;
    scrollbar-width: none;
  }
  .platform-filter::-webkit-scrollbar { display: none; }
  .pf-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 13px 5px 9px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font);
    transition: all .15s;
    flex-shrink: 0;
  }
  .pf-btn img { width: 16px; height: 16px; border-radius: 4px; object-fit: contain; }
  .pf-avatar {
    width: 16px; height: 16px;
    border-radius: 4px;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 600;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .pf-btn:hover { background: var(--surface-2); border-color: var(--accent); color: var(--text-primary); }
  .pf-btn.active {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }
  .pf-count { font-size: 11px; color: var(--text-tertiary); font-weight: 400; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-group { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 3px; box-shadow: var(--shadow-sm); }
  .filter-btn {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 14px;
    border-radius: 16px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--font);
    transition: all .15s;
  }
  .filter-btn:hover { color: var(--text-primary); }
  .filter-btn.active {
    background: var(--surface-2);
    color: var(--text-primary);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }

  .divider { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }

  .view-toggle { display: flex; gap: 4px; }
  .vt-btn {
    font-size: 13px;
    padding: 5px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all .15s;
    box-shadow: var(--shadow-sm);
  }
  .vt-btn:hover { background: var(--surface-2); color: var(--text-primary); }
  .vt-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

  .toolbar-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }

  .icon-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    cursor: pointer;
    font-family: var(--font);
    transition: all .15s;
    box-shadow: var(--shadow-sm);
  }
  .icon-btn:hover { background: var(--surface-2); transform: translateY(-1px); box-shadow: var(--shadow); }
  .icon-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(99,102,241,.3);
  }
  .icon-btn.primary:hover { background: var(--accent-hover); box-shadow: 0 4px 14px rgba(99,102,241,.4); }

  /* ── Group header ── */
  .group-hdr {
    padding: 10px 0 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: .08em;
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--border-light);
    margin-top: 8px;
  }
  .group-hdr:first-child { border-top: none; margin-top: 0; }
  .group-hdr img { width: 16px; height: 16px; border-radius: 4px; object-fit: contain; }
  .group-avatar {
    width: 16px; height: 16px;
    border-radius: 4px;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 600;
    color: var(--text-secondary);
  }
  .group-count {
    font-size: 11px;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 1px 8px;
    color: var(--text-tertiary);
    font-weight: 500;
  }

  /* ── Grid & Cards ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px;
    padding-bottom: 4px;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    box-shadow: var(--shadow-sm);
    transition: all .2s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--card-accent, var(--border));
    opacity: 0;
    transition: opacity .2s;
  }
  .card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: var(--border); }
  .card:hover::before { opacity: 1; }
  .card[data-status="ready"] { --card-accent: var(--green); }
  .card[data-status="cooling"] { --card-accent: var(--amber); }
  .card[data-status="expired"] { --card-accent: var(--red); }

  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-logo-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .card-logo {
    width: 26px; height: 26px;
    border-radius: 6px;
    object-fit: contain;
    flex-shrink: 0;
    background: var(--surface-2);
    border: 1px solid var(--border-light);
  }
  .card-logo-avatar {
    width: 26px; height: 26px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent-light), var(--surface-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .platform-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-top-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    box-shadow: 0 0 0 2px var(--surface);
  }
  .dot-ready { background: var(--green); box-shadow: 0 0 0 2px var(--surface), 0 0 6px rgba(16,185,129,.4); }
  .dot-cooling { background: var(--amber); }
  .dot-expired { background: var(--red); }

  .del-btn {
    color: var(--text-tertiary);
    background: none;
    border: none;
    cursor: pointer;
    padding: 3px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1;
    transition: all .15s;
  }
  .del-btn:hover { color: var(--red); background: var(--red-bg); }

  .card-info { display: flex; flex-direction: column; gap: 3px; }
  .card-email {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-note {
    font-size: 11px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-height: 16px;
  }

  .timer-block {
    font-size: 12px;
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .timer-label { color: var(--text-secondary); flex: 1; font-size: 11px; font-weight: 500; }
  .timer-val { font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .tv-ready { color: var(--green); }
  .tv-cooling { color: var(--amber); }
  .tv-expired { color: var(--red); }

  .card-actions { display: flex; gap: 5px; flex-wrap: wrap; }
  .act-btn {
    font-size: 11px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font);
    transition: all .15s;
  }
  .act-btn:hover { background: var(--border); color: var(--text-primary); transform: translateY(-1px); }
  .act-btn.primary { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .act-btn.primary:hover { background: var(--accent); color: #fff; }
  .act-btn.danger { background: var(--red-bg); border-color: var(--red); color: var(--red-text); }

  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 14px;
    grid-column: 1/-1;
  }
  .empty-icon { font-size: 40px; display: block; margin: 0 auto 12px; opacity: .5; }
  .empty-title { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }

  /* ── Modals ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border);
    padding: 24px;
    width: 380px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: modal-in .18s ease;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(8px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .modal-icon {
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    background: var(--accent-light);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .modal h3 { font-size: 16px; font-weight: 700; color: var(--text-primary); }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
  .field input,
  .field select,
  .field textarea {
    font-size: 13px;
    font-family: var(--font);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-primary);
    width: 100%;
    transition: border-color .15s, box-shadow .15s;
    outline: none;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    background: var(--surface);
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field select { cursor: pointer; }

  .logo-preview-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .logo-preview {
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    object-fit: contain;
    background: var(--surface-2);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo-hint { font-size: 11px; color: var(--text-tertiary); }

  .section-sep {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: .06em;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 14px;
  }
  .section-sep::before,
  .section-sep::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-light);
  }

  .reset-row { display: flex; gap: 8px; align-items: center; }
  .reset-row input[type=number] { width: 90px; flex-shrink: 0; }
  .reset-row select { flex: 1; }

  .modal-footer { display: flex; gap: 8px; margin-top: 20px; }
  .modal-footer .act-btn {
    flex: 1;
    padding: 9px 0;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    justify-content: center;
    border-radius: var(--radius-sm);
  }
  .modal-footer .act-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal-footer .act-btn.primary:hover { background: var(--accent-hover); }

  .json-area {
    font-size: 12px;
    font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-primary);
    width: 100%;
    min-height: 140px;
    resize: vertical;
    outline: none;
    transition: border-color .15s;
    font-family: var(--font);
  }
  .json-area:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }

  .info-msg {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    padding: 10px 13px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--border-light);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .hdr-title { font-size: 15px; }
    .icon-btn span { display: none; }
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <div class="hdr">
    <div class="hdr-left">
      <div class="hdr-brand">
        <div class="hdr-icon" style="background:none;box-shadow:none;padding:0;overflow:hidden;width:52px;height:52px;flex-shrink:0"><img src="logo/logo-removebg-preview.png" alt="Logo" style="width:130%;height:130%;object-fit:cover;object-position:center;margin:-15%;display:block" /></div>
        <div>
          <div class="hdr-title">AI Account Pool</div>
          <span class="hdr-sub">Quản lý tài khoản AI</span>
        </div>
      </div>
      <div class="stats-row" id="stats"></div>
    </div>
    <div class="hdr-actions">
      <button class="theme-btn" onclick="toggleTheme()" title="Chuyển theme" aria-label="Chuyển theme sáng/tối">
        <i class="ti ti-moon" id="theme-icon" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <!-- Platform filter -->
  <div class="platform-section">
    <div class="platform-filter" id="platform-filter"></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="filter-group">
      <button class="filter-btn active" data-f="all" onclick="setFilter('all')">Tất cả</button>
      <button class="filter-btn" data-f="ready" onclick="setFilter('ready')">Ready</button>
      <button class="filter-btn" data-f="cooling" onclick="setFilter('cooling')">Đang chờ</button>
      <button class="filter-btn" data-f="expired" onclick="setFilter('expired')">Hết hạn</button>
    </div>

    <div class="divider"></div>

    <div class="view-toggle">
      <button class="vt-btn active" id="vt-flat" onclick="setView('flat')" title="Lưới phẳng"><i class="ti ti-layout-grid" aria-hidden="true"></i></button>
      <button class="vt-btn" id="vt-group" onclick="setView('group')" title="Nhóm platform"><i class="ti ti-layout-list" aria-hidden="true"></i></button>
    </div>

    <div class="toolbar-right">
      <button class="icon-btn" onclick="openImport()"><i class="ti ti-upload" aria-hidden="true"></i> <span>Import</span></button>
      <button class="icon-btn" onclick="doExport()"><i class="ti ti-download" aria-hidden="true"></i> <span>Export</span></button>
      <button class="icon-btn primary" onclick="openAdd()"><i class="ti ti-plus" aria-hidden="true"></i> <span>Thêm</span></button>
    </div>
  </div>

  <div id="content"></div>
</div>

<!-- Add/Edit modal -->
<div class="overlay" id="modal-add" style="display:none" onclick="overlayClose(event,'modal-add')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-icon"><i class="ti ti-user-plus" id="modal-icon-el" aria-hidden="true"></i></div>
      <h3 id="modal-title">Thêm account mới</h3>
    </div>

    <div class="field">
      <label>Platform</label>
      <input id="f-platform" list="platforms-list" placeholder="Cursor, Codex, Windsurf…" oninput="onPlatformInput()" />
      <datalist id="platforms-list">
        <option value="Cursor"><option value="Codex"><option value="Windsurf">
        <option value="v0"><option value="Lovable"><option value="Bolt">
        <option value="Replit"><option value="Gemini"><option value="Perplexity">
        <option value="ChatGPT"><option value="Claude"><option value="Grok"><option value="Copilot">
      </datalist>
    </div>

    <div class="field">
      <label>Logo URL <span style="font-weight:400;color:var(--text-tertiary)">(tuỳ chọn)</span></label>
      <input id="f-logo" placeholder="https://…" oninput="onLogoInput()" />
      <div class="logo-preview-row">
        <img id="logo-preview" class="logo-preview" src="" alt="" style="display:none" />
        <span class="logo-hint" id="logo-hint">Để trống — tự lấy favicon</span>
      </div>
    </div>

    <div class="field">
      <label>Email / Tên account</label>
      <input id="f-email" placeholder="email@example.com hoặc tên bất kỳ" />
    </div>

    <div class="field">
      <label>Ghi chú</label>
      <textarea id="f-note" placeholder="Mật khẩu, token, ghi chú…"></textarea>
    </div>

    <div class="section-sep">Trạng thái</div>

    <div class="field">
      <label>Trạng thái ban đầu</label>
      <select id="f-status" onchange="onStatusChange()">
        <option value="ready">✅ Ready</option>
        <option value="cooling">⏳ Đang chờ reset</option>
        <option value="expired">❌ Hết hạn</option>
      </select>
    </div>

    <div class="field" id="cooling-block" style="display:none">
      <label>Thời gian còn lại đến khi reset</label>
      <div class="reset-row">
        <input type="number" id="f-dur" min="1" value="24" />
        <select id="f-unit">
          <option value="3600000">giờ</option>
          <option value="86400000">ngày</option>
          <option value="604800000">tuần</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <button class="act-btn" onclick="closeModal('modal-add')"><i class="ti ti-x" aria-hidden="true"></i> Huỷ</button>
      <button class="act-btn primary" onclick="saveAccount()"><i class="ti ti-device-floppy" aria-hidden="true"></i> Lưu</button>
    </div>
  </div>
</div>

<!-- Import/Export modal -->
<div class="overlay" id="modal-io" style="display:none" onclick="overlayClose(event,'modal-io')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-icon"><i class="ti ti-file-import" id="io-icon" aria-hidden="true"></i></div>
      <h3 id="io-title">Export JSON</h3>
    </div>
    <div class="info-msg" id="io-msg"></div>
    <div class="field">
      <label id="io-label">Dữ liệu JSON</label>
      <textarea class="json-area" id="io-json" spellcheck="false"></textarea>
    </div>
    <div class="modal-footer" id="io-btns"></div>
  </div>
</div>

<script>
let accounts = [];
let filter = 'all';
let platformFilter = 'all';
let viewMode = 'flat';
let editId = null;

// Theme
const savedTheme = localStorage.getItem('aip_theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('aip_theme', next);
  updateThemeIcon(next);
}
function updateThemeIcon(theme) {
  const ic = document.getElementById('theme-icon');
  if (ic) ic.className = theme === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
}

const KNOWN_LOGOS = {
  cursor: 'https://www.cursor.com/favicon.ico',
  codex: 'https://cdn.openai.com/API/logo-small.png',
  windsurf: 'https://windsurf.com/favicon.ico',
  'v0': 'https://v0.dev/favicon.ico',
  lovable: 'https://lovable.dev/favicon.ico',
  bolt: 'https://bolt.new/favicon.ico',
  replit: 'https://replit.com/public/icons/favicon-96x96.png',
  gemini: 'https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg',
  perplexity: 'https://www.perplexity.ai/favicon.ico',
  chatgpt: 'https://chat.openai.com/favicon.ico',
  claude: 'https://claude.ai/favicon.ico',
  grok: 'https://x.ai/favicon.ico',
  copilot: 'https://copilot.microsoft.com/favicon.ico',
};

function guessLogo(platform) {
  if (!platform) return '';
  const key = platform.toLowerCase().trim();
  if (KNOWN_LOGOS[key]) return KNOWN_LOGOS[key];
  const domain = key.replace(/\s+/g, '') + '.com';
  return 'https://www.google.com/s2/favicons?domain=' + domain + '&sz=64';
}
function logoFor(acc) { return acc.logo || guessLogo(acc.platform); }

try { accounts = JSON.parse(localStorage.getItem('aip_v3') || '[]'); } catch(e) {}
function persist() { try { localStorage.setItem('aip_v3', JSON.stringify(accounts)); } catch(e) {} }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function statusOf(acc) {
  if (acc.status === 'ready') return 'ready';
  if (acc.status === 'cooling') { if (acc.resetAt && Date.now() >= acc.resetAt) return 'expired'; return 'cooling'; }
  return 'expired';
}
function fmtCD(ms) {
  if (ms <= 0) return '00:00:00';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sc = s % 60;
  if (h >= 24) { const d = Math.floor(h / 24), rh = h % 24; return d + 'n ' + String(rh).padStart(2, '0') + ':' + String(m).padStart(2, '0'); }
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(sc).padStart(2, '0');
}

function getPlatforms() {
  const seen = new Set(); const list = [];
  accounts.forEach(a => { const p = a.platform || ''; if (p && !seen.has(p)) { seen.add(p); list.push(a); } });
  return list.sort((a, b) => (a.platform || '').localeCompare(b.platform || ''));
}

function renderPlatformFilter() {
  const pf = document.getElementById('platform-filter');
  const platforms = getPlatforms();
  let html = `<button class="pf-btn${platformFilter === 'all' ? ' active' : ''}" onclick="setPlatformFilter('all')">
    <i class="ti ti-apps" aria-hidden="true" style="font-size:14px"></i>
    Tất cả <span class="pf-count">${accounts.length}</span>
  </button>`;
  platforms.forEach(a => {
    const logo = logoFor(a);
    const cnt = accounts.filter(x => x.platform === a.platform).length;
    const active = platformFilter === a.platform;
    html += `<button class="pf-btn${active ? ' active' : ''}" onclick="setPlatformFilter('${esc(a.platform)}')">
      <img src="${esc(logo)}" alt="" onerror="this.outerHTML='<div class=pf-avatar>${esc((a.platform||'?').slice(0,2).toUpperCase())}</div>'" />
      ${esc(a.platform)} <span class="pf-count">${cnt}</span>
    </button>`;
  });
  pf.innerHTML = html;
}

function cardHTML(acc) {
  const st = statusOf(acc);
  const dotClass = st === 'ready' ? 'dot-ready' : st === 'cooling' ? 'dot-cooling' : 'dot-expired';
  const logo = logoFor(acc);

  let timerHtml = '';
  if (st === 'ready') {
    timerHtml = `<div class="timer-block"><i class="ti ti-circle-check" aria-hidden="true" style="color:var(--green);font-size:14px"></i><span class="timer-label">Sẵn sàng sử dụng</span><span class="timer-val tv-ready">✓</span></div>`;
  } else if (st === 'cooling') {
    const rem = acc.resetAt - Date.now();
    timerHtml = `<div class="timer-block"><i class="ti ti-hourglass" aria-hidden="true" style="font-size:14px;color:var(--amber)"></i><span class="timer-label">Reset sau</span><span class="timer-val tv-cooling" id="cd-${acc.id}">${fmtCD(rem)}</span></div>`;
  } else {
    timerHtml = `<div class="timer-block"><i class="ti ti-alert-circle" aria-hidden="true" style="font-size:14px;color:var(--red)"></i><span class="timer-label">Hết giới hạn</span><span class="timer-val tv-expired">Hết</span></div>`;
  }

  let actions = '';
  if (st === 'ready') {
    actions = `<button class="act-btn primary" onclick="markUsed('${acc.id}')"><i class="ti ti-player-play" aria-hidden="true"></i> Dùng ngay</button>`;
  } else if (st === 'cooling') {
    actions = `<button class="act-btn" onclick="markReady('${acc.id}')"><i class="ti ti-check" aria-hidden="true"></i> Ready ngay</button>`;
  } else {
    actions = `<button class="act-btn primary" onclick="markCooling('${acc.id}')"><i class="ti ti-refresh" aria-hidden="true"></i> Bắt đầu chờ</button><button class="act-btn" onclick="markReady('${acc.id}')">Ready</button>`;
  }

  const logoEl = logo
    ? `<img class="card-logo" src="${esc(logo)}" alt="${esc(acc.platform || '')}" onerror="this.style.display='none';document.getElementById('av-${acc.id}').style.display='flex'" /><div class="card-logo-avatar" id="av-${acc.id}" style="display:none">${esc((acc.platform || '?').slice(0, 2).toUpperCase())}</div>`
    : `<div class="card-logo-avatar">${esc((acc.platform || '?').slice(0, 2).toUpperCase())}</div>`;

  return `<div class="card" data-id="${acc.id}" data-status="${st}">
    <div class="card-top">
      <div class="card-logo-wrap">${logoEl}<span class="platform-name">${esc(acc.platform || '—')}</span></div>
      <div class="card-top-right">
        <div class="status-dot ${dotClass}" title="${st}"></div>
        <button class="del-btn" onclick="delAccount('${acc.id}')" aria-label="Xoá account"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="card-info">
      <div class="card-email">${esc(acc.email || '—')}</div>
      <div class="card-note">${esc(acc.note || '')}</div>
    </div>
    ${timerHtml}
    <div class="card-actions">${actions}<button class="act-btn" onclick="editAccount('${acc.id}')" style="margin-left:auto" aria-label="Sửa"><i class="ti ti-pencil" aria-hidden="true"></i></button></div>
  </div>`;
}

function render() {
  const ready = accounts.filter(a => statusOf(a) === 'ready').length;
  const cooling = accounts.filter(a => statusOf(a) === 'cooling').length;
  const expired = accounts.filter(a => statusOf(a) === 'expired').length;

  document.getElementById('stats').innerHTML =
    `<span class="stat-pill s-ready"><i class="ti ti-check" aria-hidden="true"></i>${ready} ready</span>
     <span class="stat-pill s-cooling"><i class="ti ti-clock" aria-hidden="true"></i>${cooling} chờ</span>
     <span class="stat-pill s-expired"><i class="ti ti-alert-triangle" aria-hidden="true"></i>${expired} hết hạn</span>`;

  renderPlatformFilter();

  let filtered = accounts.filter(a => {
    const stOk = filter === 'all' || statusOf(a) === filter;
    const pfOk = platformFilter === 'all' || a.platform === platformFilter;
    return stOk && pfOk;
  });

  const content = document.getElementById('content');
  if (!filtered.length) {
    content.innerHTML = `<div class="grid"><div class="empty">
      <i class="ti ti-inbox empty-icon" aria-hidden="true"></i>
      <div class="empty-title">Không có account nào</div>
      <div>Thêm account mới hoặc thay đổi bộ lọc</div>
    </div></div>`;
    return;
  }

  if (viewMode === 'flat') {
    content.innerHTML = `<div class="grid">${filtered.map(cardHTML).join('')}</div>`;
  } else {
    const groups = {};
    filtered.forEach(a => { const k = a.platform || '(Không rõ)'; if (!groups[k]) groups[k] = []; groups[k].push(a); });
    const keys = Object.keys(groups).sort();
    content.innerHTML = keys.map(k => {
      const sample = groups[k][0];
      const logo = logoFor(sample);
      const logoEl = logo
        ? `<img src="${esc(logo)}" alt="" style="width:16px;height:16px;border-radius:4px;object-fit:contain" onerror="this.style.display='none'" />`
        : `<div class="group-avatar">${esc((k || '?').slice(0, 2).toUpperCase())}</div>`;
      return `<div class="group-hdr">${logoEl}${esc(k)}<span class="group-count">${groups[k].length}</span></div><div class="grid">${groups[k].map(cardHTML).join('')}</div>`;
    }).join('');
  }
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  render();
}
function setPlatformFilter(p) { platformFilter = p; render(); }
function setView(v) {
  viewMode = v;
  document.getElementById('vt-flat').classList.toggle('active', v === 'flat');
  document.getElementById('vt-group').classList.toggle('active', v === 'group');
  render();
}

function markUsed(id) {
  const acc = accounts.find(a => a.id === id); if (!acc) return;
  const dur = prompt('Cooldown bao nhiêu? (giờ, hoặc ngày kiểu 7d)', '24'); if (!dur) return;
  let ms = dur.trim().endsWith('d') ? parseFloat(dur) * 86400000 : parseFloat(dur) * 3600000;
  if (!ms || ms <= 0) return;
  acc.status = 'cooling'; acc.resetAt = Date.now() + ms; persist(); render();
}
function markCooling(id) {
  const acc = accounts.find(a => a.id === id); if (!acc) return;
  const dur = prompt('Chờ reset bao nhiêu giờ?', '24'); if (!dur) return;
  const ms = parseFloat(dur) * 3600000; if (!ms || ms <= 0) return;
  acc.status = 'cooling'; acc.resetAt = Date.now() + ms; persist(); render();
}
function markReady(id) { const acc = accounts.find(a => a.id === id); if (!acc) return; acc.status = 'ready'; acc.resetAt = null; persist(); render(); }
function delAccount(id) { if (!confirm('Xoá account này?')) return; accounts = accounts.filter(a => a.id !== id); persist(); render(); }

function onPlatformInput() {
  const p = document.getElementById('f-platform').value.trim();
  const logoField = document.getElementById('f-logo');
  if (!logoField.value.trim()) {
    const auto = guessLogo(p);
    document.getElementById('logo-hint').textContent = auto ? 'Tự động: ' + auto : 'Chưa có logo tự động';
    updateLogoPreview(auto);
  }
}
function onLogoInput() {
  const url = document.getElementById('f-logo').value.trim();
  updateLogoPreview(url);
  document.getElementById('logo-hint').textContent = url ? '' : 'Để trống — tự lấy favicon';
}
function updateLogoPreview(url) {
  const img = document.getElementById('logo-preview');
  if (url) { img.src = url; img.style.display = 'block'; }
  else img.style.display = 'none';
}

function openAdd() {
  editId = null;
  ['f-platform', 'f-email', 'f-note', 'f-logo'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-status').value = 'ready';
  document.getElementById('f-dur').value = '24';
  document.getElementById('f-unit').value = '3600000';
  document.getElementById('logo-preview').style.display = 'none';
  document.getElementById('logo-hint').textContent = 'Để trống — tự lấy favicon';
  document.getElementById('modal-title').textContent = 'Thêm account mới';
  document.getElementById('modal-icon-el').className = 'ti ti-user-plus';
  onStatusChange();
  document.getElementById('modal-add').style.display = 'flex';
  setTimeout(() => document.getElementById('f-platform').focus(), 50);
}
function editAccount(id) {
  const acc = accounts.find(a => a.id === id); if (!acc) return;
  editId = id;
  document.getElementById('f-platform').value = acc.platform || '';
  document.getElementById('f-email').value = acc.email || '';
  document.getElementById('f-note').value = acc.note || '';
  document.getElementById('f-logo').value = acc.logo || '';
  document.getElementById('f-status').value = acc.status || 'ready';
  document.getElementById('modal-title').textContent = 'Sửa account';
  document.getElementById('modal-icon-el').className = 'ti ti-edit';
  const logoSrc = acc.logo || guessLogo(acc.platform);
  updateLogoPreview(logoSrc);
  document.getElementById('logo-hint').textContent = acc.logo ? '' : 'Auto: ' + logoSrc;
  onStatusChange();
  document.getElementById('modal-add').style.display = 'flex';
}
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function overlayClose(e, id) { if (e.target === e.currentTarget) closeModal(id); }
function onStatusChange() {
  document.getElementById('cooling-block').style.display =
    document.getElementById('f-status').value === 'cooling' ? 'block' : 'none';
}

function saveAccount() {
  const platform = document.getElementById('f-platform').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const note = document.getElementById('f-note').value.trim();
  const logo = document.getElementById('f-logo').value.trim();
  const status = document.getElementById('f-status').value;
  if (!platform && !email) { alert('Nhập ít nhất platform hoặc email.'); return; }
  let resetAt = null;
  if (status === 'cooling') {
    const dur = parseFloat(document.getElementById('f-dur').value);
    const unit = parseFloat(document.getElementById('f-unit').value);
    resetAt = Date.now() + dur * unit;
  }
  if (editId) {
    const acc = accounts.find(a => a.id === editId);
    if (acc) { acc.platform = platform; acc.email = email; acc.note = note; acc.logo = logo; acc.status = status; acc.resetAt = resetAt; }
  } else {
    accounts.push({ id: uid(), platform, email, note, logo, status, resetAt, createdAt: Date.now() });
  }
  persist(); closeModal('modal-add'); render();
}

function doExport() {
  const json = JSON.stringify(accounts, null, 2);
  document.getElementById('io-title').textContent = 'Export JSON';
  document.getElementById('io-icon').className = 'ti ti-download';
  document.getElementById('io-msg').textContent = accounts.length + ' account — Copy hoặc tải file về.';
  document.getElementById('io-label').textContent = 'Dữ liệu JSON';
  document.getElementById('io-json').value = json;
  document.getElementById('io-btns').innerHTML =
    `<button class="act-btn" onclick="closeModal('modal-io')"><i class="ti ti-x"></i> Đóng</button>
     <button class="act-btn primary" onclick="copyJSON()"><i class="ti ti-copy"></i> Copy</button>
     <button class="act-btn primary" onclick="downloadJSON()"><i class="ti ti-download"></i> Tải file</button>`;
  document.getElementById('modal-io').style.display = 'flex';
}
function copyJSON() {
  const t = document.getElementById('io-json').value;
  navigator.clipboard.writeText(t).then(() => { document.getElementById('io-msg').textContent = '✅ Đã copy vào clipboard!'; })
    .catch(() => { document.getElementById('io-json').select(); document.execCommand('copy'); });
}
function downloadJSON() {
  const blob = new Blob([document.getElementById('io-json').value], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'ai-accounts-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
}
function openImport() {
  document.getElementById('io-title').textContent = 'Import JSON';
  document.getElementById('io-icon').className = 'ti ti-upload';
  document.getElementById('io-msg').textContent = 'Dán JSON vào đây rồi chọn chế độ nhập bên dưới.';
  document.getElementById('io-label').textContent = 'JSON cần import';
  document.getElementById('io-json').value = '';
  document.getElementById('io-btns').innerHTML =
    `<button class="act-btn" onclick="closeModal('modal-io')"><i class="ti ti-x"></i> Huỷ</button>
     <button class="act-btn" onclick="doImport('merge')"><i class="ti ti-git-merge"></i> Merge</button>
     <button class="act-btn primary" onclick="doImport('replace')"><i class="ti ti-replace"></i> Thay thế</button>`;
  document.getElementById('modal-io').style.display = 'flex';
}
function doImport(mode) {
  let parsed;
  try { parsed = JSON.parse(document.getElementById('io-json').value.trim()); } catch(e) { alert('JSON không hợp lệ.'); return; }
  if (!Array.isArray(parsed)) { alert('Dữ liệu phải là mảng JSON.'); return; }
  parsed = parsed.map(a => ({ id: a.id || uid(), platform: a.platform || '', email: a.email || '', note: a.note || '', logo: a.logo || '', status: a.status || 'ready', resetAt: a.resetAt || null, createdAt: a.createdAt || Date.now() }));
  if (mode === 'replace') {
    if (!confirm('Thay thế toàn bộ ' + accounts.length + ' account hiện tại?')) return;
    accounts = parsed;
  } else {
    const ex = new Set(accounts.map(a => a.id)); let added = 0;
    parsed.forEach(a => { if (!ex.has(a.id)) { accounts.push(a); added++; } });
    alert('Merge: thêm ' + added + ', bỏ qua ' + (parsed.length - added) + ' trùng.');
  }
  persist(); closeModal('modal-io'); render();
}

// Keyboard shortcut: Esc to close modals
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    ['modal-add', 'modal-io'].forEach(id => { const el = document.getElementById(id); if (el.style.display !== 'none') closeModal(id); });
  }
});

// Generate cropped favicon from center of logo
(function() {
  const img = new Image();
  img.onload = function() {
    const size = 64;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const scale = Math.max(size / img.width, size / img.height) * 2.0;
    const w = img.width * scale, h = img.height * scale;
    const x = (size - w) / 2, y = (size - h) / 2;
    ctx.drawImage(img, x, y, w, h);
    document.getElementById('favicon').href = canvas.toDataURL('image/png');
  };
  img.src = 'logo/logo-removebg-preview.png';
})();

render();
setInterval(() => {
  accounts.forEach(a => {
    if (a.status === 'cooling' && a.resetAt && Date.now() >= a.resetAt) changed = true;
    if (a.status === 'cooling' && a.resetAt && Date.now() < a.resetAt) {
      const el = document.getElementById('cd-' + a.id);
      if (el) el.textContent = fmtCD(a.resetAt - Date.now());
    }
  });
  if (changed) { persist(); render(); }
}, 1000);
</script>
</body>
</html>
